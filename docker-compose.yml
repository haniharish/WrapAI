version: '3.8'

services:
  # 1. Redis Cache & BullMQ Message Broker
  redis:
    image: redis:7-alpine
    container_name: wrapai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Python FastAPI AI Microservice (Speech-to-Text & Media Preprocessing)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: wrapai-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-wrapai_internal_ai_service_secret_key_minimum_32_chars_2026}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Node.js Express API Gateway Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wrapai-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROCESSING_QUEUE_NAME=content-processing
      - WORKER_CONCURRENCY=2
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-wrapai_internal_ai_service_secret_key_minimum_32_chars_2026}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - STORAGE_PROVIDER=LOCAL
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - backend-uploads:/app/uploads

  # 4. Dedicated Background Processing Worker Process
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wrapai-worker
    restart: always
    command: npm run worker
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROCESSING_QUEUE_NAME=content-processing
      - WORKER_CONCURRENCY=2
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-wrapai_internal_ai_service_secret_key_minimum_32_chars_2026}
      - STORAGE_PROVIDER=LOCAL
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      ai-service:
        condition: service_started
    volumes:
      - backend-uploads:/app/uploads

volumes:
  redis-data:
  backend-uploads:
