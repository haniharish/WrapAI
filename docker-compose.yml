version: '3.8'

services:
  # 1. Redis Cache & BullMQ Message Broker
  redis:
    image: redis:7-alpine
    container_name: wrapai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Node.js Express API Gateway Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wrapai-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROCESSING_QUEUE_NAME=content-processing
      - WORKER_CONCURRENCY=2
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - STORAGE_PROVIDER=LOCAL
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads

  # 3. Dedicated Background Processing Worker Process
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wrapai-worker
    restart: always
    command: npm run worker
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROCESSING_QUEUE_NAME=content-processing
      - WORKER_CONCURRENCY=2
      - STORAGE_PROVIDER=LOCAL
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend-uploads:/app/uploads

volumes:
  redis-data:
  backend-uploads:
