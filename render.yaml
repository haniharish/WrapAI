services:
  # 1. Python FastAPI AI Service
  - type: web
    name: wrapai-ai-service
    runtime: python
    rootDir: ai-service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_ENV
        value: production

  # 2. Node.js Express API Gateway Backend
  - type: web
    name: wrapai-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb+srv://wrapai2004_db_user:Harish12314159@cluster0.yrqwtjo.mongodb.net/wrapai?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: wrapai-ai-service
          property: host

  # 3. React Vite Frontend Single Page Application
  - type: web
    name: wrapai-client
    runtime: static
    rootDir: client
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: wrapai-backend
          property: host
